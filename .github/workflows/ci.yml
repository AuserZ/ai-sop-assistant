name: Project checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      paddleocr: ${{ steps.filter.outputs.paddleocr }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "paddleocr=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "paddleocr=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" HEAD -- \
            infra/paddleocr \
            .github/workflows/ci.yml \
            .codex/scripts/check-prd-integrity.mjs \
            'AI SOP Assistant — Technical Product Req.md' \
            'PRD AI SOP Assistant.pdf' | grep -q .; then
            echo "paddleocr=true" >> "$GITHUB_OUTPUT"
          else
            echo "paddleocr=false" >> "$GITHUB_OUTPUT"
          fi

  paddleocr:
    needs: changes
    if: needs.changes.outputs.paddleocr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - run: node .codex/scripts/check-prd-integrity.mjs
      - name: Build pinned CPU OCR image
        run: docker compose -f infra/paddleocr/compose.yml --progress plain build paddleocr
      - name: Verify offline OCR and sandbox failures
        run: node infra/paddleocr/verify.mjs

  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: 1
      WORKFLOW_PROBE_CALLBACK_DELAY_MS: "2000"
      COMPOSE_FILE: docker-compose.yml:infra/storage-fixture/compose.yml
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:prd
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: node --test infra/n8n/local-secrets.test.mjs
      - run: node --test infra/storage-fixture/gateway.test.mjs infra/storage-fixture/secrets.test.mjs
      - name: Check infrastructure verification and bootstrap scripts
        run: |
          node --check infra/paddleocr/verify.mjs
          node --check infra/conversion/verify.mjs
          node --check infra/n8n/bootstrap.mjs
          node --check infra/backup/crypto.mjs infra/backup/storage.mjs infra/backup/run-backup.mjs infra/backup/run-restore.mjs infra/backup/escrow-keys.mjs infra/backup/schedule.mjs infra/backup/drill.mjs
          for script in infra/deploy/release-manifest.mjs infra/deploy/smoke-check.mjs infra/deploy/deploy.mjs infra/deploy/rollback.mjs; do node --check "$script"; done
          node --check scripts/security-scan-artifacts.mjs scripts/verify-hardening.mjs scripts/ops-monitor.mjs scripts/load-benchmark.mjs
          node infra/conversion/verify.mjs
          node scripts/verify-hardening.mjs
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Scan built artifacts and workflow exports for leaks
        run: node scripts/security-scan-artifacts.mjs
      - name: Check Compose and run application smoke and database tests
        run: |
          npm run dev:secrets
          node scripts/local-secrets.mjs --with-backup
          node infra/storage-fixture/create-secrets.mjs
          docker compose --profile verify --profile conversion config --quiet
          docker compose -f docker-compose.yml -f infra/backup/compose.backup.yml --profile backup config --quiet
          APP_IMAGE_DIGEST="ghcr.io/auserz/ai-sop-assistant-app@sha256:1111111111111111111111111111111111111111111111111111111111111111" \
          MIGRATE_IMAGE_DIGEST="ghcr.io/auserz/ai-sop-assistant-migrate@sha256:2222222222222222222222222222222222222222222222222222222222222222" \
          PADDLEOCR_IMAGE_DIGEST="ghcr.io/auserz/ai-sop-assistant-paddleocr@sha256:3333333333333333333333333333333333333333333333333333333333333333" \
          CONVERSION_IMAGE_DIGEST="ghcr.io/auserz/ai-sop-assistant-convert-worker@sha256:4444444444444444444444444444444444444444444444444444444444444444" \
          BACKUP_SCHEDULER_IMAGE_DIGEST="ghcr.io/auserz/ai-sop-assistant-backup-scheduler@sha256:5555555555555555555555555555555555555555555555555555555555555555" \
          docker compose -f docker-compose.yml -f infra/deploy/compose.release.yml config --quiet
          APP_IMAGE_DIGEST="ghcr.io/auserz/ai-sop-assistant-app@sha256:1111111111111111111111111111111111111111111111111111111111111111" \
          MIGRATE_IMAGE_DIGEST="ghcr.io/auserz/ai-sop-assistant-migrate@sha256:2222222222222222222222222222222222222222222222222222222222222222" \
          PADDLEOCR_IMAGE_DIGEST="ghcr.io/auserz/ai-sop-assistant-paddleocr@sha256:3333333333333333333333333333333333333333333333333333333333333333" \
          CONVERSION_IMAGE_DIGEST="ghcr.io/auserz/ai-sop-assistant-convert-worker@sha256:4444444444444444444444444444444444444444444444444444444444444444" \
          BACKUP_SCHEDULER_IMAGE_DIGEST="ghcr.io/auserz/ai-sop-assistant-backup-scheduler@sha256:5555555555555555555555555555555555555555555555555555555555555555" \
          docker compose -f docker-compose.yml -f infra/backup/compose.backup.yml -f infra/deploy/compose.release.yml --profile backup config --quiet
          docker compose --profile verify build app migrate verify-db
          docker compose build storage-fixture paddleocr convert-worker
          SOP_STORAGE_FIXTURE_VERIFY=1 SOP_STORAGE_FIXTURE_IMAGE=ai-sop-assistant-storage-fixture node infra/storage-fixture/verify-native.mjs
          SOP_CONVERSION_VERIFY_DOCKER=1 SOP_CONVERSION_IMAGE=ai-sop-assistant-convert-worker node infra/conversion/verify.mjs
          docker compose up --wait --wait-timeout 180 postgres
          docker compose run --rm --no-deps migrate
          docker compose --profile verify run --rm --no-deps verify-db
          docker compose up --wait --wait-timeout 300 proxy
          docker compose up --wait --no-deps --wait-timeout 120 storage-fixture
          curl --fail --silent --show-error http://127.0.0.1:3000/api/health/live
          curl --fail --silent --show-error http://127.0.0.1:3000/api/health/ready
          docker compose --profile conversion run --rm --build convert
      - name: Verify authentication and workflow browser journeys
        run: |
          npx playwright install --with-deps chromium
          install -d -m 700 .local-secrets/browser-fixtures
          docker compose --profile verify run --rm --no-deps --user "$(id -u):$(id -g)" \
            -e SOP_SYNTHETIC_AUTH=1 -e BROWSER_FIXTURE_DIRECTORY=/browser-fixtures \
            -v "$PWD/.local-secrets/browser-fixtures:/browser-fixtures" verify-db \
            node --import tsx tests/e2e/seed.ts
          npm run test:browser
      - name: Verify workflow recovery and proxy timeout
        env:
          SOP_WORKFLOW_TEST_PROJECT: ai-sop-assistant
        run: |
          node scripts/verify-workflow-runtime.mjs
          docker compose up --wait --no-deps --force-recreate --wait-timeout 120 storage-fixture
      - name: Verify native POST redirect controls
        env:
          SOP_WORKFLOW_TEST_PROJECT: ai-sop-assistant
        run: node infra/n8n/verify-redirects.mjs
      - name: Stop disposable services
        if: always()
        run: docker compose --profile verify --profile conversion down --volumes --remove-orphans

  backup-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - run: node .codex/scripts/check-prd-integrity.mjs
      - name: Generate local synthetic and backup secrets
        run: |
          node scripts/local-secrets.mjs --with-backup
      - name: Build backup-scheduler and migrate images and verify PG18/Node24 ABI
        run: |
          docker compose -f docker-compose.yml -f infra/backup/compose.backup.yml --profile backup build backup-scheduler
          docker compose build migrate
          docker compose -f docker-compose.yml -f infra/backup/compose.backup.yml --profile backup run --rm --no-deps --entrypoint sh backup-scheduler -c 'node --version && pg_dump --version && psql --version'
      - name: Run live encrypted backup (sop_backup), key escrow recovery, and isolated PG18 restore drill
        run: |
          set -euo pipefail
          DRILL_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/ai-sop-ci-dr-XXXXXX")"
          echo "DRILL_DIR=$DRILL_DIR" >> "$GITHUB_ENV"
          chmod 755 "$DRILL_DIR"
          mkdir -p "$DRILL_DIR/backup-out"
          sudo chown -R 1000:1000 "$DRILL_DIR/backup-out"

          docker compose -p ai-sop-dr-source up --wait --wait-timeout 180 postgres
          docker compose -p ai-sop-dr-source run --rm --no-deps migrate
          docker compose -p ai-sop-dr-source up --wait --wait-timeout 180 n8n-main
          docker compose -p ai-sop-dr-source run --rm --no-deps n8n-bootstrap

          docker compose -p ai-sop-dr-source -f docker-compose.yml -f infra/backup/compose.backup.yml --profile backup \
            run --rm --no-deps \
            -v "$DRILL_DIR/backup-out:/tmp/backup-out" \
            backup-scheduler \
            node infra/backup/run-backup.mjs \
            --backup-id ci-dr-drill-001 \
            --local-dir /tmp/backup-out

          EXPECTED_FP="$(tr -d '\r\n' < .local-secrets/n8n-encryption-key-fingerprint)"
          node infra/backup/escrow-keys.mjs --create \
            --n8n-key-file .local-secrets/n8n-encryption-key \
            --passphrase-file .local-secrets/backup-escrow-passphrase \
            --backup-key-file .local-secrets/backup-encryption-key \
            --output "$DRILL_DIR/escrow.bundle.json"
          node infra/backup/escrow-keys.mjs --verify \
            --input "$DRILL_DIR/escrow.bundle.json" \
            --passphrase-file .local-secrets/backup-escrow-passphrase \
            --expected-fingerprint "$EXPECTED_FP"
          node infra/backup/escrow-keys.mjs --recover \
            --input "$DRILL_DIR/escrow.bundle.json" \
            --passphrase-file .local-secrets/backup-escrow-passphrase \
            --expected-fingerprint "$EXPECTED_FP" \
            --output-key-file "$DRILL_DIR/recovered-n8n-key"
          cmp -s .local-secrets/n8n-encryption-key "$DRILL_DIR/recovered-n8n-key"
          sudo chown 1000:1000 "$DRILL_DIR/recovered-n8n-key"

          docker compose -p ai-sop-dr-drill-ci up --wait --wait-timeout 180 postgres
          docker compose -p ai-sop-dr-drill-ci -f docker-compose.yml -f infra/backup/compose.backup.yml --profile backup \
            run --rm --no-deps \
            -e POSTGRES_PASSWORD_FILE=/tmp/drill-postgres-admin \
            -e N8N_ENCRYPTION_KEY_FILE=/tmp/recovered-n8n-key \
            -v "$PWD/.local-secrets/postgres-admin:/tmp/drill-postgres-admin:ro" \
            -v "$DRILL_DIR/recovered-n8n-key:/tmp/recovered-n8n-key:ro" \
            -v "$DRILL_DIR/backup-out:/tmp/backup-in:ro" \
            backup-scheduler \
            node infra/backup/run-restore.mjs \
            --isolated-target \
            --target-project ai-sop-dr-drill-ci \
            --target-host postgres \
            --backup-id ci-dr-drill-001 \
            --local-dir /tmp/backup-in/ci-dr-drill-001

          docker compose -p ai-sop-dr-drill-ci up --wait --wait-timeout 180 n8n-main
      - name: Tear down isolated DR drill stacks
        if: always()
        run: |
          docker compose -p ai-sop-dr-source -f docker-compose.yml -f infra/backup/compose.backup.yml --profile backup down --volumes --remove-orphans || true
          docker compose -p ai-sop-dr-drill-ci -f docker-compose.yml -f infra/backup/compose.backup.yml --profile backup down --volumes --remove-orphans || true
          if [ -n "${DRILL_DIR:-}" ] && [ -d "$DRILL_DIR" ]; then sudo rm -rf "$DRILL_DIR"; fi
