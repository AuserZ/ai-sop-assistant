name: Project checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      paddleocr: ${{ steps.filter.outputs.paddleocr }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "paddleocr=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "paddleocr=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" HEAD -- \
            infra/paddleocr \
            .github/workflows/ci.yml \
            .codex/scripts/check-prd-integrity.mjs \
            'AI SOP Assistant — Technical Product Req.md' \
            'PRD AI SOP Assistant.pdf' | grep -q .; then
            echo "paddleocr=true" >> "$GITHUB_OUTPUT"
          else
            echo "paddleocr=false" >> "$GITHUB_OUTPUT"
          fi

  paddleocr:
    needs: changes
    if: needs.changes.outputs.paddleocr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - run: node .codex/scripts/check-prd-integrity.mjs
      - name: Build pinned CPU OCR image
        run: docker compose -f infra/paddleocr/compose.yml --progress plain build paddleocr
      - name: Verify offline OCR and sandbox failures
        run: node infra/paddleocr/verify.mjs

  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: 1
      WORKFLOW_PROBE_CALLBACK_DELAY_MS: "2000"
      COMPOSE_FILE: docker-compose.yml:infra/storage-fixture/compose.yml
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:prd
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: node --test infra/n8n/local-secrets.test.mjs
      - run: node --test infra/storage-fixture/gateway.test.mjs infra/storage-fixture/secrets.test.mjs
      - name: Check infrastructure verification and bootstrap scripts
        run: |
          node --check infra/paddleocr/verify.mjs
          node --check infra/conversion/verify.mjs
          node --check infra/n8n/bootstrap.mjs
          node --check infra/backup/crypto.mjs infra/backup/storage.mjs infra/backup/run-backup.mjs infra/backup/run-restore.mjs infra/backup/escrow-keys.mjs infra/backup/schedule.mjs infra/backup/drill.mjs
          node --check scripts/security-scan-artifacts.mjs scripts/verify-hardening.mjs scripts/ops-monitor.mjs scripts/load-benchmark.mjs
          node infra/conversion/verify.mjs
          node scripts/verify-hardening.mjs
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Scan built artifacts and workflow exports for leaks
        run: node scripts/security-scan-artifacts.mjs
      - name: Check Compose and run application smoke and database tests
        run: |
          npm run dev:secrets
          node scripts/local-secrets.mjs --with-backup
          node infra/storage-fixture/create-secrets.mjs
          docker compose --profile verify --profile conversion config --quiet
          docker compose -f docker-compose.yml -f infra/backup/compose.backup.yml --profile backup config --quiet
          docker compose --profile verify build app migrate verify-db
          docker compose build storage-fixture paddleocr convert-worker
          SOP_STORAGE_FIXTURE_VERIFY=1 SOP_STORAGE_FIXTURE_IMAGE=ai-sop-assistant-storage-fixture node infra/storage-fixture/verify-native.mjs
          SOP_CONVERSION_VERIFY_DOCKER=1 SOP_CONVERSION_IMAGE=ai-sop-assistant-convert-worker node infra/conversion/verify.mjs
          docker compose up --wait --wait-timeout 180 postgres
          docker compose run --rm --no-deps migrate
          docker compose --profile verify run --rm --no-deps verify-db
          docker compose up --wait --wait-timeout 300 proxy
          docker compose up --wait --no-deps --wait-timeout 120 storage-fixture
          curl --fail --silent --show-error http://127.0.0.1:3000/api/health/live
          curl --fail --silent --show-error http://127.0.0.1:3000/api/health/ready
          docker compose --profile conversion run --rm --build convert
      - name: Verify authentication and workflow browser journeys
        run: |
          npx playwright install --with-deps chromium
          install -d -m 700 .local-secrets/browser-fixtures
          docker compose --profile verify run --rm --no-deps --user "$(id -u):$(id -g)" \
            -e SOP_SYNTHETIC_AUTH=1 -e BROWSER_FIXTURE_DIRECTORY=/browser-fixtures \
            -v "$PWD/.local-secrets/browser-fixtures:/browser-fixtures" verify-db \
            node --import tsx tests/e2e/seed.ts
          npm run test:browser
      - name: Verify workflow recovery and proxy timeout
        env:
          SOP_WORKFLOW_TEST_PROJECT: ai-sop-assistant
        run: |
          node scripts/verify-workflow-runtime.mjs
          docker compose up --wait --no-deps --force-recreate --wait-timeout 120 storage-fixture
      - name: Verify native POST redirect controls
        env:
          SOP_WORKFLOW_TEST_PROJECT: ai-sop-assistant
        run: node infra/n8n/verify-redirects.mjs
      - name: Stop disposable services
        if: always()
        run: docker compose --profile verify --profile conversion down --volumes --remove-orphans
