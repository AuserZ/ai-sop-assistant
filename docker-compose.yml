name: ai-sop-assistant

x-app-db: &app-db
  DB_HOST: postgres
  APP_DB_PASSWORD_FILE: /run/secrets/app-runtime

services:
  postgres:
    image: pgvector/pgvector:0.8.3-pg18-trixie@sha256:6232c5ea178707f278d060b51747c30f310164595674e95d5f9d100f4a48b56c
    environment:
      POSTGRES_USER: sop_bootstrap
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-admin
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-sop.sh:ro
      - ./infra/postgres/bootstrap.sql:/opt/sop/bootstrap.sql:ro
    secrets: [postgres-admin, app-runtime, app-migrator, n8n-db]
    networks: [database]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "sop_bootstrap", "-d", "sop_app"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: tooling
    command: ["npm", "run", "db:migrate"]
    environment:
      DB_HOST: postgres
      MIGRATION_DB_PASSWORD_FILE: /run/secrets/app-migrator
    secrets: [app-migrator]
    networks: [database]
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      target: runtime
    environment: *app-db
    ports: ["127.0.0.1:3000:3000"]
    secrets: [app-runtime]
    networks: [database, edge]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 4s
      retries: 20

  verify-db:
    profiles: [verify]
    build:
      context: .
      target: tooling
    command: ["npm", "run", "test:db"]
    environment:
      <<: *app-db
      WORKFLOW_DB_PASSWORD_FILE: /run/secrets/n8n-db
    secrets: [app-runtime, n8n-db]
    networks: [database]
    depends_on:
      migrate:
        condition: service_completed_successfully

  convert:
    profiles: [conversion]
    build: ./infra/conversion
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    tmpfs: ["/tmp:size=128m,mode=1777"]

networks:
  database:
    internal: true
  edge:

volumes:
  postgres-data:

secrets:
  postgres-admin:
    file: ./.local-secrets/postgres-admin
  app-runtime:
    file: ./.local-secrets/app-runtime
  app-migrator:
    file: ./.local-secrets/app-migrator
  n8n-db:
    file: ./.local-secrets/n8n-db
